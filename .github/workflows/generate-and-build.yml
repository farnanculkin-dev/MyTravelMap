name: Generate TopoJSON and Build

on:
  push:
    branches:
      - init-v1
  pull_request:
    branches:
      - init-v1
  workflow_dispatch:

jobs:
  generate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate TopoJSON
        run: npm run generate:topo

      - name: Build application
        run: npm run build

      - name: Upload generated TopoJSON
        uses: actions/upload-artifact@v4
        with:
          name: europe-topo-json
          path: public/data/europe-topo.json

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
